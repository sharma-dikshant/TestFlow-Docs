site_name: TestFlow | Docs
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mermaid2
nav:
  - Home: index.md
  - Phase 1:
      - Overview: phase-1/overview.md
      - Architecture: phase-1/architecture.md
      - ERD: phase-1/erd.md
      - ERDv2: phase-1/erdv2.md
      - Data Access Pattern: phase-1/data-access-pattern.md
